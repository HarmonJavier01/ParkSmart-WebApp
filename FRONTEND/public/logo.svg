<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="90" height="90" x="5" y="5" rx="22" fill="url(#grad)" />
  <!-- Letter P representing Parking -->
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">P</text>
  <!-- Smart locator pin above P -->
  <circle cx="50" cy="22" r="5" fill="#38bdf8" />
</svg>
